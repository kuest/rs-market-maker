[package]
name = "rs-market-maker"
version = "0.1.1"
edition = "2024"
rust-version = "1.91.1"
publish = false

[dependencies]
anyhow = "1.0.104"
alloy = { version = "2.1.1", default-features = false, features = ["signer-local", "signers"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
kuest-client-sdk = { path = "vendor/rs-clob-client", features = ["clob"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
